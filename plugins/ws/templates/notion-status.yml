# Moves Notion Kanban cards along with the PR lifecycle.
# Card ↔ PR link: `task-<ID>` in the branch name (e.g. feat/polo/task-637-changelog).
#   PR opened            → 👀 In Review   (head branch only)
#   merged into develop  → ✅ Staging
#   merged into main     → Production     (head branch + every task-<ID> in the PR's merge commits,
#                                          so a develop → main deploy PR ships all its cards)
# Never fails the PR: Notion problems only emit a warning.
name: Notion card status

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notion:
    if: (github.event.action != 'closed' && !github.event.pull_request.draft) || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    steps:
      - env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE: 21dd2a41-6a2a-4364-a906-9c8323548051
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$NOTION_TOKEN" ] || { echo "::warning::NOTION_TOKEN secret missing, skipping"; exit 0; }

          ids() { grep -oiE 'task-[0-9]+' | grep -oE '[0-9]+' | sort -un; }

          if [ "$ACTION" != closed ]; then
            STATUS="👀 In Review"; IDS=$(echo "$HEAD_REF" | ids)
          elif [ "$BASE_REF" = develop ]; then
            STATUS="✅ Staging";   IDS=$(echo "$HEAD_REF" | ids)
          elif [ "$BASE_REF" = main ]; then
            STATUS="Production"
            IDS=$({ echo "$HEAD_REF"; gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message'; } | ids)
          else
            exit 0
          fi
          [ -n "$IDS" ] || { echo "No task-<ID> found, nothing to move"; exit 0; }

          notion() { curl -sS -X "$1" "https://api.notion.com/v1/$2" -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2025-09-03" -H "Content-Type: application/json" -d "$3"; }

          for id in $IDS; do
            page=$(notion POST "data_sources/$DATA_SOURCE/query" \
              "{\"filter\":{\"property\":\"ID\",\"unique_id\":{\"equals\":$id}}}" | jq -r '.results[0].id // empty')
            if [ -z "$page" ]; then echo "::warning::TASK-$id not found in Notion"; continue; fi
            res=$(notion PATCH "pages/$page" "{\"properties\":{\"Statut\":{\"select\":{\"name\":\"$STATUS\"}}}}")
            if echo "$res" | jq -e '.object == "page"' >/dev/null; then
              echo "TASK-$id → $STATUS"
            else
              echo "::warning::TASK-$id update failed: $(echo "$res" | jq -r '.message // .')"
            fi
          done
